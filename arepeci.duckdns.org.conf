# Apache vhost for arepeci.duckdns.org
# Place this file in: /etc/httpd/conf.d/arepeci.duckdns.org.conf

<VirtualHost *:80>
    ServerName arepeci.duckdns.org
    ServerAlias www.arepeci.duckdns.org

    DocumentRoot /var/www/html

    ErrorLog /var/www/error.log
    CustomLog /var/www/requests.log combined

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName arepeci.duckdns.org
    ServerAlias www.arepeci.duckdns.org

    DocumentRoot /var/www/html

    ErrorLog /var/www/ssl_error.log
    CustomLog /var/www/ssl_requests.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/arepeci.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/arepeci.duckdns.org/privkey.pem

    # Recommended baseline TLS settings
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
