# ============================================
# SecureApp - Configuración de la aplicación
# ============================================

# Puerto del servidor
server.port=8443

# ============================================
# Configuración SSL/TLS
# ============================================
# Tipo de keystore (PKCS12 es el estándar, alternativa: JKS)
server.ssl.key-store-type=PKCS12
# Ruta al keystore (relativa al classpath o absoluta)
server.ssl.key-store=classpath:ecikeystore.p12
# Contraseña del keystore
server.ssl.key-store-password=123456
# Alias de la llave en el keystore
server.ssl.key-alias=ecikeypair

# ============================================
# Configuración del servidor
# ============================================
# Apagado elegante (graceful shutdown)
server.shutdown=graceful
# Tiempo máximo de espera para conexiones activas durante el apagado
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
# Configuración de logging
# ============================================
logging.level.com.eci.secureapp=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Nombre de la aplicación
# ============================================
spring.application.name=SecureApp
